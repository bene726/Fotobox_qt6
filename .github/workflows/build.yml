# Baut fotobox als .deb fuer Raspberry Pi OS (arm64, Bookworm und Trixie),
# veroeffentlicht Nightlies und Releases und pflegt das Apt-Repo auf GitHub Pages.
#
# Jeder Lauf prueft zuerst die Tests (Job "test", Host-Build auf x86_64) und
# baut danach das Paket fuer arm64. Der Host-Build ist bewusst dabei: er ist der
# einzige Lauf, der die Zweige ohne FOTOBOX_PI uebersetzt.
#
#   Push auf main  -> Nightly-Release (Tag "nightly") + Apt-Komponente "nightly"
#   Tag v*         -> Release + Apt-Komponente "main"
#   Pull Request   -> nur bauen
#
# Optional (fuer ein signiertes Repo): Secrets APT_GPG_PRIVATE_KEY (ASCII-armored)
# und APT_GPG_PASSPHRASE. Ohne Schluessel wird das Repo unsigniert veroeffentlicht.

name: Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  DISTS: trixie

jobs:
  # ------------------------------------------------------------ Version aus Git
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          PRERELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # Erlaubt: v1.2.3 und Vorabversionen wie v1.2.3-rc1
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Tag '$TAG' passt nicht zum Schema vMAJOR.MINOR.PATCH (z. B. v0.1.0)."
              exit 1
            fi
            VERSION="${TAG#v}"
            CHANNEL=main
            if [[ "$TAG" == *-* ]]; then PRERELEASE=true; fi
          else
            LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            if [[ -n "$LAST" ]]; then
              BASE="${LAST#v}"; N=$(git rev-list --count "${LAST}..HEAD")
            else
              BASE="0.0.0"; N=$(git rev-list --count HEAD)
            fi
            VERSION="${BASE}+git$(date -u +%Y%m%d%H%M).${N}.g$(git rev-parse --short HEAD)"
            CHANNEL=nightly
            TAG=nightly
          fi
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL"       >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"               >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION ($CHANNEL, Vorabversion: $PRERELEASE)"

  # ------------------------------------------------------------ Tests (Host-Build)
  #
  # Laeuft auf x86_64 und ohne FOTOBOX_PI, also mit den Host-Backends. Damit
  # deckt dieser Job zwei Dinge ab, die der Paketbau nicht sieht: die Zweige
  # fuer den Entwicklungsrechner und eine zweite Architektur.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Abhaengigkeiten
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev \
            libgl1 libegl1 libxkbcommon0 fonts-dejavu-core
      - uses: actions/checkout@v7
      - name: Konfigurieren und bauen
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFOTOBOX_TESTS=ON
          cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Diagnose ohne Bildschirm
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen
          FB=build/fotobox

          # Muessen mit 0 enden.
          for opt in --version --help --dump-config; do
            echo "--- $opt"
            "$FB" "$opt" > /dev/null
          done

          # Ohne Kamera und ohne GPIO-Chip melden diese Befehle einen Fehler
          # (Rueckgabe 1). Geprueft wird hier, dass sie nicht abstuerzen und
          # nicht haengen.
          for opt in --list-cameras --gpio-info; do
            echo "--- $opt"
            rc=0
            timeout 60 "$FB" "$opt" > /dev/null 2>&1 || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error::fotobox $opt endete mit $rc"
              exit 1
            fi
          done
      - name: Oberflaeche aufbauen und abbilden
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen
          mkdir -p shots

          # Jedes Design und jeder Startzustand werden einmal wirklich
          # gezeichnet. Ein Stylesheet mit einem nicht ersetzten Platzhalter
          # oder ein fehlendes Widget faellt hier auf, nicht erst am Event.
          for theme in retro neon elegant wedding-blush wedding-green pool; do
            timeout 60 build/fotobox --windowed --camera dummy --liveview dummy \
              --trigger timer --theme "$theme" --screenshot "shots/$theme.png"
          done
          for state in liveview settings countdown shutdown; do
            timeout 60 build/fotobox --windowed --camera dummy --liveview dummy \
              --trigger timer --show "$state" --screenshot "shots/zustand-$state.png"
          done

          for f in shots/*.png; do
            test -s "$f" || { echo "::error::$f ist leer"; exit 1; }
            file "$f" | grep -q "PNG image data" || { echo "::error::$f ist kein PNG"; exit 1; }
          done
          ls -l shots
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: error

  # ------------------------------------------------------------ Warnungen
  #
  # Eigener Job, damit ein Paketbau nie an einer Warnung scheitert. Geprueft
  # wird mit g++, also mit dem Compiler des Zielsystems.
  warnings:
    runs-on: ubuntu-latest
    steps:
      - name: Abhaengigkeiten
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev
      - uses: actions/checkout@v7
      - name: Host-Build ohne Warnungen
        run: |
          cmake -B build-host -G Ninja -DFOTOBOX_WERROR=ON
          cmake --build build-host
      - name: Pi-Build ohne Warnungen
        run: |
          cmake -B build-pi -G Ninja -DFOTOBOX_PI=ON -DFOTOBOX_WERROR=ON
          cmake --build build-pi

  # ------------------------------------------------------------ .deb pro Distribution
  build-deb:
    needs: version
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        dist: [trixie]
    container:
      image: debian:${{ matrix.dist }}
    steps:
      - name: Build-Abhaengigkeiten
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates file dpkg-dev \
            qt6-base-dev qt6-multimedia-dev
      - uses: actions/checkout@v7
      - name: Konfigurieren und bauen
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFOTOBOX_PI=ON \
            -DFOTOBOX_TESTS=ON \
            -DFOTOBOX_VERSION="${{ needs.version.outputs.version }}"
          cmake --build build
      - name: Tests auf der Zielarchitektur
        # Dieselben Tests wie im Job "test", hier aber mit der Qt-Version und
        # der Architektur des Raspberry Pi. Die Testprogramme landen nicht im
        # Paket: installiert wird nur das Ziel fotobox.
        run: ctest --test-dir build --output-on-failure
      - name: Paket bauen
        run: |
          cd build && cpack -G DEB
          ls -l *.deb
          dpkg-deb -I *.deb
      - name: Rauchtest
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends ./build/fotobox_*.deb
          export QT_QPA_PLATFORM=offscreen

          # Das installierte Programm, nicht das aus dem Baum: so faellt ein
          # fehlender Pfad oder eine fehlende Abhaengigkeit des Pakets auf.
          for opt in --version --help --dump-config; do
            echo "--- $opt"
            fotobox "$opt" > /dev/null
          done

          # Im Container gibt es keinen GPIO-Chip; erwartet wird Rueckgabe 1,
          # kein Absturz.
          rc=0
          timeout 60 fotobox --gpio-info > /dev/null 2>&1 || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::fotobox --gpio-info endete mit $rc"
            exit 1
          fi

          # Die mitgelieferte Unit muss dort liegen, wo systemd --user sucht.
          test -f /usr/lib/systemd/user/fotobox.service
          grep -q "^WatchdogSec=" /usr/lib/systemd/user/fotobox.service
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.dist }}
          path: build/fotobox_*.deb
          if-no-files-found: error

  # ------------------------------------------------------------ Release + Apt-Repo
  publish:
    needs: [version, test, warnings, build-deb]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: apt-repo
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # volle Historie fuer den Changelog
      - uses: actions/download-artifact@v8
        with:
          path: debs
      - name: Pakete umbenennen (Distribution im Dateinamen)
        run: |
          set -euo pipefail
          mkdir -p out
          for d in $DISTS; do
            # Mehrere Artefakte landen in debs/deb-<dist>/, ein einzelnes direkt in debs/.
            dir="debs/deb-$d"
            if [ ! -d "$dir" ]; then dir="debs"; fi
            found=0
            for f in "$dir"/*.deb; do
              [ -e "$f" ] || continue
              cp "$f" "out/$(basename "${f%.deb}")_$d.deb"
              found=1
            done
            if [ "$found" -eq 0 ]; then
              echo "::error::Kein Paket fuer $d gefunden. Inhalt von debs/:"
              find debs -type f | sed 's/^/  /'
              exit 1
            fi
          done
          cd out && sha256sum *.deb | tee SHA256SUMS
      - name: Release-Text erzeugen
        run: |
          python3 scripts/release_notes.py \
            --version "$VERSION" --channel "$CHANNEL" --tag "${TAG:-}" \
            --repo "$GITHUB_REPOSITORY" \
            out/*.deb > notes.md
          echo "--- notes.md ---"; cat notes.md

      # --- GitHub Release
      - name: Nightly-Release aktualisieren
        if: env.CHANNEL == 'nightly'
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly out/* \
            --prerelease --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" \
            --notes-file notes.md
      - name: Release erstellen
        if: env.CHANNEL == 'main'
        run: |
          FLAGS=()
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --title "Fotobox $VERSION" --notes-file notes.md "${FLAGS[@]}"
          else
            gh release create "$TAG" out/* \
              --title "Fotobox $VERSION" --notes-file notes.md "${FLAGS[@]}"
          fi

      # --- Apt-Repo im Branch gh-pages pflegen
      - name: gh-pages auschecken
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site 2>/dev/null \
          || { mkdir site && git -C site init -b gh-pages; }
      - name: GPG-Schluessel importieren
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APT_GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::Secret APT_GPG_PRIVATE_KEY ist leer oder fehlt - das Apt-Repo wird UNSIGNIERT veroeffentlicht."
            exit 0
          fi
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          if [ -z "$KEY_ID" ]; then
            echo "::error::Schluessel importiert, aber kein geheimer Schluessel gefunden."
            exit 1
          fi
          echo "APT_GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "Signiere mit Schluessel $KEY_ID"
      - name: Repo aktualisieren
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          for d in $DISTS; do
            python3 scripts/apt_repo.py add --repo site --dist "$d" --component "$CHANNEL" out/*_"$d".deb
          done
          python3 scripts/apt_repo.py generate --repo site --dists $DISTS --keep-nightly 5 --prune-dists \
            --base-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
      - name: Repo pruefen
        run: |
          set -euo pipefail
          # Die neue Version muss in der passenden Komponente auftauchen.
          for d in $DISTS; do
            P="site/dists/$d/$CHANNEL/binary-arm64/Packages"
            if ! grep -qx "Version: $VERSION" "$P"; then
              echo "::error::Version $VERSION fehlt in $d/$CHANNEL"
              exit 1
            fi
          done
          echo "Version $VERSION in allen Distributionen (Komponente $CHANNEL) vorhanden."

          if [ -z "${APT_GPG_KEY_ID:-}" ]; then
            echo "Kein Schluessel aktiv - Repo ist unsigniert (trusted=yes noetig)."
            exit 0
          fi
          for d in $DISTS; do
            for f in InRelease Release.gpg; do
              test -s "site/dists/$d/$f" || { echo "::error::site/dists/$d/$f fehlt"; exit 1; }
            done
          done
          test -s site/fotobox.gpg || { echo "::error::site/fotobox.gpg fehlt"; exit 1; }
          gpg --batch --verify site/dists/trixie/InRelease
          echo "Signaturen vorhanden und gueltig."
      - name: gh-pages pushen
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apt: $CHANNEL $VERSION" || echo "keine Aenderung"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  # ------------------------------------------------------------ Auf GitHub Pages veroeffentlichen
  #
  # Bewusst ein eigener Job: das Deployment braucht die Umgebung "github-pages",
  # deren Schutzregeln Tags blockieren koennen. Als eigener Job kann das ein
  # Release nicht mehr verhindern - der Inhalt liegt ohnehin im Branch gh-pages.
  #
  # Hinweis: Damit Tag-Laeufe die Seite aktualisieren duerfen, muss unter
  # Settings -> Environments -> github-pages bei "Deployment branches and tags"
  # eine Regel fuer "v*" eingetragen sein.
  pages:
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - name: Apt-Repo aus gh-pages holen
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
      - uses: actions/configure-pages@v6
      - name: Site-Artefakt vorbereiten
        run: rsync -a --exclude .git site/ public/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      # Die Artefaktliste von GitHub zeigt ein gerade hochgeladenes Paket
      # manchmal noch nicht an. deploy-pages bricht dann mit "No artifacts
      # named github-pages were found" ab, obwohl das Artefakt da ist - in
      # Lauf #28 lag es mit 8,4 MB vor, der Schritt sah aber nur die beiden
      # aelteren. Je schneller der Lauf, desto wahrscheinlicher das Rennen.
      #
      # Ein zweiter Anlauf nach kurzer Pause genuegt. Schlaegt auch der fehl,
      # ist es kein Rennen und der Job soll rot werden.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Noch einmal versuchen
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::warning::Erster Veroeffentlichungsversuch fehlgeschlagen, zweiter folgt."
          sleep 20
      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
