<text x="150" y="238" text-anchor="middle" font-size="14" fill="#d6223c" font-weight="bold">Pin 1, eckig</text>
<rect x="250" y="112" width="340" height="116" rx="10" fill="#fff5f6" stroke="#d6223c" stroke-width="2.5"/><text x="266" y="140" font-size="18" font-weight="bold" fill="#d6223c">Auslöse-Taster</text><text x="266" y="166" font-size="15" fill="#333">Pin 11 → GPIO 17 (Signal)</text><text x="266" y="190" font-size="15" fill="#333">Pin 9  → Masse</text><text x="266" y="214" font-size="15" fill="#333">kein Widerstand nötig</text><path d="M 420.0 228 L 438 250" stroke="#d6223c" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M 420.0 228 L 510 250" stroke="#d6223c" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
<rect x="880" y="486" width="420" height="116" rx="10" fill="#fff5f6" stroke="#d6223c" stroke-width="2.5"/><text x="896" y="514" font-size="18" font-weight="bold" fill="#d6223c">LED-Beleuchtung (Transistor)</text><text x="896" y="540" font-size="15" fill="#333">Pin 32 → GPIO 12 (PWM-Signal)</text><text x="896" y="564" font-size="15" fill="#333">Pin 30 → Masse</text><text x="896" y="588" font-size="15" fill="#333">dtoverlay=pwm-pio,gpio=12</text><path d="M 1090.0 486 L 1158 430" stroke="#d6223c" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M 1090.0 486 L 1230 430" stroke="#d6223c" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
<text x="90" y="660" font-size="18" font-weight="bold" fill="#1a1a1a">Legende</text>
<circle cx="104" cy="685" r="11" fill="#e8a33d"/>
<text x="126" y="690" font-size="15" fill="#333">3,3 V</text>
<circle cx="104" cy="713" r="11" fill="#cf3a3a"/>
<text x="126" y="718" font-size="15" fill="#333">5 V</text>
<circle cx="104" cy="741" r="11" fill="#3f4651"/>
<text x="126" y="746" font-size="15" fill="#333">Masse (GND)</text>
<circle cx="104" cy="769" r="11" fill="#2f7d4f"/>
<text x="126" y="774" font-size="15" fill="#333">freier GPIO</text>
<circle cx="104" cy="797" r="11" fill="#1f6f8b"/>
<text x="126" y="802" font-size="15" fill="#333">GPIO mit Hardware-PWM</text>
<circle cx="104" cy="825" r="11" fill="#8a8f98"/>
<text x="126" y="830" font-size="15" fill="#333">belegt (I²C, SPI, serielle Konsole)</text>
<circle cx="104" cy="853" r="11" fill="#b8bcc2"/>
<text x="126" y="858" font-size="15" fill="#333">reserviert (EEPROM)</text>
<circle cx="104" cy="881" r="11" fill="none" stroke="#d6223c" stroke-width="3"/>
<text x="126" y="886" font-size="15" fill="#333">von der Fotobox benutzt</text>
<text x="600" y="694" font-size="15" fill="#444">• Pin 1 erkennst du auf der Platine am eckigen Lötauge, in der Nähe der Beschriftung J8.</text>
<text x="600" y="724" font-size="15" fill="#444">• Beide Verbindungen liegen jeweils in derselben Reihe nebeneinander: ein zweipoliger Stecker genügt.</text>
<text x="600" y="754" font-size="15" fill="#444">• Der Taster schaltet gegen Masse, der interne Pull-up ist aktiv. Niemals gegen 5 V schalten.</text>
<text x="600" y="784" font-size="15" fill="#444">• Die LED hängt am Transistor, der GPIO liefert nur das Signal.</text>
